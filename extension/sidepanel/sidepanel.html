<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Krify</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <h1>Krify</h1>
    <span class="spacer"></span>
    <span id="status" class="status off">● Not connected</span>
    <button id="historyBtn" class="small" title="Past tasks">🕘 History</button>
  </header>

  <section id="historyView" class="history" hidden>
    <div class="row">
      <strong>🕘 History</strong>
      <span class="spacer"></span>
      <button id="clearHistoryBtn" class="small">Clear all</button>
      <button id="closeHistoryBtn" class="small">✕ Close</button>
    </div>
    <div id="clearConfirm" class="row confirm-clear" hidden>
      Delete all history?
      <span class="spacer"></span>
      <button id="clearYesBtn" class="small">Yes, delete</button>
      <button id="clearNoBtn" class="small">No</button>
    </div>
    <ul id="historyList" class="history-list"></ul>
  </section>

  <div id="log" class="log">
    <div class="hint">Tell me what to do, e.g. <em>"search google for wireless mouse"</em></div>
  </div>

  <div class="composer">
    <div class="model-row" title="If this model hits its free limit, Krify switches to another automatically">
      🧠 Model
      <div class="model-picker">
        <button type="button" id="modelButton" class="model-button" aria-haspopup="listbox">
          <span class="model-name">(connect to the server)</span>
          <span class="model-status"></span>
          <span class="model-arrow">▾</span>
        </button>
        <ul id="modelList" class="model-list" role="listbox" hidden></ul>
      </div>
    </div>
    <div class="location-row" title="Krify uses sites and prices for this country">
      📍 Location
      <select id="countrySelect"></select>
      <button type="button" id="gpsBtn" class="small"
              title="Asks for location permission; your city helps with &quot;near me&quot; tasks">Use exact location</button>
      <span id="placeLabel" class="place" hidden>
        <span id="placeText"></span>
        <button type="button" id="forgetPlaceBtn" class="small" title="Forget exact location">✕</button>
      </span>
    </div>
    <textarea id="taskInput" rows="2" placeholder="What should I do?"></textarea>
    <div class="row">
      <button id="newBtn" class="small" title="Forget this chat">New chat</button>
      <label class="switch" title="Show Krify's cursor, typing and a glowing border on the page while it works">
        <input id="cursorToggle" type="checkbox" checked /> ✨ Show animations
      </label>
      <label class="switch" title="Show which tools were used and what they found, under the final answer">
        <input id="devModeToggle" type="checkbox" /> 🔍 Dev mode
      </label>
      <label class="switch" title="Send the FULL page data instead of the token-saving caps (more elements, uncut text) – uses a lot more tokens, best with a high-context model">
        <input id="unrestrictedToggle" type="checkbox" /> 🔓 Unrestricted
      </label>
      <span class="spacer"></span>
      <button id="stopBtn" class="stop" hidden>■ Stop</button>
      <button id="startBtn" class="start">▶ Start</button>
    </div>
  </div>

  <details class="manual">
    <summary>Manual test buttons</summary>

    <h2>See the page</h2>
    <div class="buttons">
      <button data-op="get_page_info">Page info</button>
      <button data-op="get_elements">Elements</button>
      <button data-op="read_text">Read text</button>
      <button data-op="screenshot">Screenshot</button>
      <button id="aiViewBtn" title="Exactly what the AI gets as the page each step (rendered by the server)">AI view</button>
    </div>

    <h2>Do something</h2>
    <div class="fields">
      <label>Element # <input id="elementInput" type="number" min="1" placeholder="7" /></label>
      <label>Text <input id="textInput" type="text" placeholder="text, option or URL" /></label>
    </div>
    <div class="buttons">
      <button data-op="click">Click</button>
      <button data-op="hover">Hover</button>
      <button data-op="type">Type</button>
      <button data-op="press_key" data-key="Enter">Press Enter</button>
      <button data-op="press_key" data-key="Escape">Press Esc</button>
      <button data-op="select_option">Select option</button>
      <button data-op="scroll" data-direction="up">Scroll up</button>
      <button data-op="scroll" data-direction="down">Scroll down</button>
    </div>

    <h2>Navigate</h2>
    <div class="buttons">
      <button data-op="open_url">Open URL (from Text)</button>
      <button data-op="go_back">Back</button>
      <button data-op="reload">Reload</button>
      <button data-op="wait" data-seconds="2">Wait 2s</button>
    </div>

    <pre id="output">Results of manual tests show here.</pre>
  </details>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
